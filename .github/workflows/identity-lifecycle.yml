
name: Graph Authentication Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Test PowerShell
        shell: pwsh
        run: |
          Write-Host "GitHub Actions YAML is working."
          Write-Host "PowerShell is working."

      - name: Install Microsoft Graph
        shell: pwsh
        run: |
          Install-Module Microsoft.Graph -Scope CurrentUser -Force -AllowClobber
          Write-Host "Microsoft Graph module installed."

      - name: Create temporary certificate file
        shell: pwsh
        env:
          AZURE_CERTIFICATE_PFX: ${{ secrets.AZURE_CERTIFICATE_PFX }}
        run: |
          $pfxBase64 = $env:AZURE_CERTIFICATE_PFX -replace '\s', ''

          if ([string]::IsNullOrWhiteSpace($pfxBase64)) {
              throw "AZURE_CERTIFICATE_PFX is empty."
          }

          if ($pfxBase64 -notmatch '^[A-Za-z0-9+/]*={0,2}$') {
              throw "AZURE_CERTIFICATE_PFX contains invalid Base64."
          }

          try {
              $bytes = [Convert]::FromBase64String($pfxBase64)
          }
          catch {
              throw "AZURE_CERTIFICATE_PFX is not valid Base64."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "entra-lab.pfx"

          [System.IO.File]::WriteAllBytes($pfxPath, $bytes)

          Write-Host "PFX created successfully."
          Write-Host "PFX size: $($bytes.Length) bytes"

      - name: Authenticate to Microsoft Graph
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CERTIFICATE_PASSWORD: ${{ secrets.AZURE_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "entra-lab.pfx"

          if (-not (Test-Path $pfxPath)) {
              throw "PFX file was not created."
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
              throw "AZURE_TENANT_ID is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
              throw "AZURE_CLIENT_ID is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CERTIFICATE_PASSWORD)) {
              throw "AZURE_CERTIFICATE_PASSWORD is empty."
          }

          $securePassword = ConvertTo-SecureString `
              $env:AZURE_CERTIFICATE_PASSWORD `
              -AsPlainText `
              -Force

          $cert = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $securePassword

          if (-not $cert) {
              throw "Failed to import certificate."
          }

          Write-Host "Certificate imported successfully."
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

          Connect-MgGraph `
              -TenantId $env:AZURE_TENANT_ID `
              -ClientId $env:AZURE_CLIENT_ID `
              -CertificateThumbprint $cert.Thumbprint `
              -NoWelcome

          $context = Get-MgContext

          if (-not $context) {
              throw "Microsoft Graph authentication failed."
          }

          Write-Host "Microsoft Graph authentication succeeded."
          Write-Host "Tenant ID: $($context.TenantId)"
          Write-Host "Client ID: $($context.ClientId)"

      - name: Disconnect Microsoft Graph
        if: always()
        shell: pwsh
        run: |
          Disconnect-MgGraph -ErrorAction SilentlyContinue

      - name: Clean up temporary certificate
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "entra-lab.pfx"

          if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force
              Write-Host "Temporary PFX removed."
          }
