name: Entra Identity Lifecycle - Authentication Test

on:
  workflow_dispatch:

jobs:
  test-graph-auth:
    runs-on: windows-latest

    steps:
      - name: Install Microsoft Graph PowerShell
        shell: pwsh
        run: |
          Install-Module Microsoft.Graph -Scope CurrentUser -Force -AllowClobber

      - name: Create temporary certificate file
        shell: pwsh
        env:
          AZURE_CERTIFICATE_PFX: ${{ secrets.AZURE_CERTIFICATE_PFX }}
        run: |
          $pfxBase64 = $env:AZURE_CERTIFICATE_PFX -replace '\s', ''

          if ($pfxBase64 -notmatch '^[A-Za-z0-9+/]*={0,2}$') {
              throw "AZURE_CERTIFICATE_PFX contains invalid Base64."
          }

          $bytes = [Convert]::FromBase64String($pfxBase64)

          $pfxPath = Join-Path $env:RUNNER_TEMP "entra-lab.pfx"

          [System.IO.File]::WriteAllBytes($pfxPath, $bytes)

          Write-Host "PFX created successfully."
          Write-Host "PFX size: $($bytes.Length) bytes"

      - name: Connect to Microsoft Graph
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CERTIFICATE_PASSWORD: ${{ secrets.AZURE_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "entra-lab.pfx"

          $securePassword = ConvertTo-SecureString `
              $env:AZURE_CERTIFICATE_PASSWORD `
              -AsPlainText `
              -Force

          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $securePassword,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          )

          Write-Host "Certificate loaded successfully."
          Write-Host "Thumbprint: $($certificate.Thumbprint)"
          Write-Host "Has private key: $($certificate.HasPrivateKey)"

          Connect-MgGraph `
              -ClientId $env:AZURE_CLIENT_ID `
              -TenantId $env:AZURE_TENANT_ID `
              -Certificate $certificate `
              -NoWelcome

          Get-MgContext | Format-List AppName,ClientId,TenantId,AuthType

      - name: Test Graph access
        shell: pwsh
        run: |
          Get-MgUser -Top 5 |
            Select-Object DisplayName, UserPrincipalName

